name: Deploy Student + Admin to Hostinger (SSH)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-frontends
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # NODE + PNPM
      # ============================================================

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # ============================================================
      # BUILD
      # ============================================================

      - name: Build Student + Admin
        env:
          API_URL: https://site.medschoolproffs.live
          VITE_API_BASE_URL: https://site.medschoolproffs.live
          VITE_STUDENT_URL: https://medschoolproffs.live
          VITE_ADMIN_API_URL: https://site.medschoolproffs.live
        run: bash scripts/build-hostinger.sh

      # ============================================================
      # VERIFY
      # ============================================================

      - name: Verify frontend builds
        run: |
          set -e

          test -s hostinger-out/student/index.html
          test -d hostinger-out/student/assets

          test -s hostinger-out/admin/index.html
          test -d hostinger-out/admin/assets

          echo "Student and Admin builds verified."

      # ============================================================
      # RECOVERY ARTIFACT
      # ============================================================

      - name: Save frontend builds
        uses: actions/upload-artifact@v4
        with:
          name: hostinger-frontends-${{ github.run_number }}
          path: |
            hostinger-out/student/
            hostinger-out/admin/
          include-hidden-files: true
          retention-days: 7

      # ============================================================
      # SSH TOOLS
      # ============================================================

      - name: Install SSH password helper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y sshpass

      # ============================================================
      # SSH CONNECTION TEST
      # ============================================================

      - name: Test Hostinger SSH connection
        shell: bash
        env:
          SSHPASS: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "${SSHPASS:-}" ]]; then
            echo "::error::HOSTINGER_SSH_PASSWORD is missing."
            exit 1
          fi

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          sshpass -e ssh \
            -p 65002 \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            u603474365@194.5.156.45 \
            "command -v rsync >/dev/null &&
             test -d '/home/u603474365/domains/medschoolproffs.live/public_html' &&
             test -d '/home/u603474365/domains/admin.medschoolproffs.live/public_html'"

          echo "Hostinger SSH connection verified."
          echo "rsync available."
          echo "Student directory verified."
          echo "Admin directory verified."

      # ============================================================
      # DEPLOY
      # ============================================================

      - name: Deploy Student + Admin with rsync
        shell: bash
        env:
          SSHPASS: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
        run: |
          set -euo pipefail

          HOST="194.5.156.45"
          PORT="65002"
          USER="u603474365"

          REMOTE="${USER}@${HOST}"

          STUDENT_DIR="/home/u603474365/domains/medschoolproffs.live/public_html"
          ADMIN_DIR="/home/u603474365/domains/admin.medschoolproffs.live/public_html"

          SSH_COMMAND="ssh \
            -p ${PORT} \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile=$HOME/.ssh/known_hosts \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3"

          deploy_site() {

            LABEL="$1"
            SOURCE="$2"
            TARGET="$3"

            echo "=========================================="
            echo "Deploying ${LABEL}"
            echo "=========================================="

            for ATTEMPT in 1 2 3; do

              echo "${LABEL}: attempt ${ATTEMPT}/3"

              # --------------------------------------------------
              # FIRST:
              # Upload assets, .htaccess, favicon, robots, etc.
              #
              # index.html is deliberately excluded here.
              # --------------------------------------------------

              if sshpass -e rsync \
                -az \
                --no-owner \
                --no-group \
                --no-perms \
                --omit-dir-times \
                --partial \
                --exclude='/index.html' \
                -e "$SSH_COMMAND" \
                "${SOURCE}/" \
                "${REMOTE}:${TARGET}/"; then

                echo "${LABEL}: assets uploaded."

                # ----------------------------------------------
                # SECOND:
                # Upload index.html LAST.
                #
                # This reduces the chance that the browser gets
                # a new index before its new JS/CSS files exist.
                # ----------------------------------------------

                if sshpass -e rsync \
                  -az \
                  --no-owner \
                  --no-group \
                  --no-perms \
                  -e "$SSH_COMMAND" \
                  "${SOURCE}/index.html" \
                  "${REMOTE}:${TARGET}/index.html"; then

                  echo "${LABEL}: index.html uploaded."
                  echo "${LABEL}: deployment successful."

                  return 0

                fi

              fi

              if (( ATTEMPT < 3 )); then

                WAIT_TIME=$((ATTEMPT * 20))

                echo "${LABEL}: deployment attempt failed."
                echo "Waiting ${WAIT_TIME} seconds before retry..."

                sleep "$WAIT_TIME"

              fi

            done

            echo "::error::${LABEL} deployment failed after 3 attempts."

            return 1
          }

          # ======================================================
          # STUDENT
          # ======================================================

          deploy_site \
            "Student" \
            "hostinger-out/student" \
            "$STUDENT_DIR"

          # ======================================================
          # ADMIN
          # ======================================================

          deploy_site \
            "Admin" \
            "hostinger-out/admin" \
            "$ADMIN_DIR"

          echo "=========================================="
          echo "BOTH FRONTENDS DEPLOYED SUCCESSFULLY"
          echo "=========================================="

      # ============================================================
      # COMPLETE
      # ============================================================

      - name: Deployment completed
        run: |
          echo "=========================================="
          echo "MedSchoolProffs frontend deployment done."
          echo ""
          echo "Student: https://medschoolproffs.live"
          echo "Admin:   https://admin.medschoolproffs.live"
          echo ""
          echo "Method: SSH + rsync"
          echo "Host:   194.5.156.45"
          echo "Port:   65002"
          echo ""
          echo "cPanel API deployment remains separate."
          echo "=========================================="
