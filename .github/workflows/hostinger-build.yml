name: Deploy Student + Admin to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Build Student + Admin
        env:
          API_URL: https://api.medschoolproffs.live
        run: |
          bash scripts/build-hostinger.sh

      - name: Deploy Student frontend
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 194.5.156.45
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./hostinger-out/student/
          server-dir: ./

      - name: Deploy Admin frontend
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.ADMIN_FTP_HOST }}
          username: ${{ secrets.ADMIN_FTP_USERNAME }}
          password: ${{ secrets.ADMIN_FTP_PASSWORD }}
          port: ${{ secrets.ADMIN_FTP_PORT }}
          protocol: ftp
          local-dir: ./hostinger-out/admin/
          server-dir: ./
