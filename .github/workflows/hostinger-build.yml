name: Deploy Student + Admin to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Prevent two frontend deployments from running over each other.
concurrency:
  group: hostinger-frontends
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Keep using the existing build script.
      # It also builds the API, but this workflow only deploys
      # the Student and Admin frontend output.
      - name: Build frontends
        env:
          API_URL: https://site.medschoolproffs.live
          VITE_API_BASE_URL: https://site.medschoolproffs.live
          VITE_STUDENT_URL: https://medschoolproffs.live
          VITE_ADMIN_API_URL: https://site.medschoolproffs.live
        run: bash scripts/build-hostinger.sh

      - name: Verify frontend builds
        run: |
          echo "Checking Student build..."
          test -s hostinger-out/student/index.html
          test -d hostinger-out/student/assets

          echo "Checking Admin build..."
          test -s hostinger-out/admin/index.html
          test -d hostinger-out/admin/assets

          echo "Frontend builds verified."

      # Keep a downloadable copy in GitHub Actions in case
      # Hostinger FTP has a temporary problem.
      - name: Save frontend builds
        uses: actions/upload-artifact@v4
        with:
          name: hostinger-frontends-${{ github.run_number }}
          path: |
            hostinger-out/student/
            hostinger-out/admin/
          include-hidden-files: true
          retention-days: 7

      # ============================================================
      # STUDENT DEPLOYMENT
      # ============================================================

      - name: Deploy Student - attempt 1
        id: student_1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftp
          local-dir: ./hostinger-out/student/
          server-dir: ./

      - name: Wait before Student retry 2
        if: steps.student_1.outcome == 'failure'
        run: |
          echo "Student attempt 1 failed. Waiting 20 seconds..."
          sleep 20

      - name: Deploy Student - attempt 2
        id: student_2
        if: steps.student_1.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftp
          local-dir: ./hostinger-out/student/
          server-dir: ./

      - name: Wait before Student retry 3
        if: >
          steps.student_1.outcome == 'failure' &&
          steps.student_2.outcome == 'failure'
        run: |
          echo "Student attempt 2 failed. Waiting 40 seconds..."
          sleep 40

      - name: Deploy Student - attempt 3
        id: student_3
        if: >
          steps.student_1.outcome == 'failure' &&
          steps.student_2.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftp
          local-dir: ./hostinger-out/student/
          server-dir: ./

      # ============================================================
      # ADMIN DEPLOYMENT
      # ============================================================

      - name: Deploy Admin - attempt 1
        id: admin_1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.ADMIN_FTP_HOST }}
          username: ${{ secrets.ADMIN_FTP_USERNAME }}
          password: ${{ secrets.ADMIN_FTP_PASSWORD }}
          port: ${{ secrets.ADMIN_FTP_PORT }}
          protocol: ftp
          local-dir: ./hostinger-out/admin/
          server-dir: ./

      - name: Wait before Admin retry 2
        if: steps.admin_1.outcome == 'failure'
        run: |
          echo "Admin attempt 1 failed. Waiting 20 seconds..."
          sleep 20

      - name: Deploy Admin - attempt 2
        id: admin_2
        if: steps.admin_1.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.ADMIN_FTP_HOST }}
          username: ${{ secrets.ADMIN_FTP_USERNAME }}
          password: ${{ secrets.ADMIN_FTP_PASSWORD }}
          port: ${{ secrets.ADMIN_FTP_PORT }}
          protocol: ftp
          local-dir: ./hostinger-out/admin/
          server-dir: ./

      - name: Wait before Admin retry 3
        if: >
          steps.admin_1.outcome == 'failure' &&
          steps.admin_2.outcome == 'failure'
        run: |
          echo "Admin attempt 2 failed. Waiting 40 seconds..."
          sleep 40

      - name: Deploy Admin - attempt 3
        id: admin_3
        if: >
          steps.admin_1.outcome == 'failure' &&
          steps.admin_2.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.ADMIN_FTP_HOST }}
          username: ${{ secrets.ADMIN_FTP_USERNAME }}
          password: ${{ secrets.ADMIN_FTP_PASSWORD }}
          port: ${{ secrets.ADMIN_FTP_PORT }}
          protocol: ftp
          local-dir: ./hostinger-out/admin/
          server-dir: ./

      - name: Deployment summary
        if: success()
        run: |
          echo "======================================"
          echo "Frontend deployment completed."
          echo "Student: https://medschoolproffs.live"
          echo "Admin:   https://admin.medschoolproffs.live"
          echo "======================================"
