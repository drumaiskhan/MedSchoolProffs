name: Deploy Student + Admin to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Prevent multiple frontend deployments from running at the same time
concurrency:
  group: hostinger-frontends
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # NODE + PNPM
      # ============================================================

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # ============================================================
      # BUILD
      # ============================================================

      - name: Build Student + Admin
        env:
          API_URL: https://site.medschoolproffs.live
          VITE_API_BASE_URL: https://site.medschoolproffs.live
          VITE_STUDENT_URL: https://medschoolproffs.live
          VITE_ADMIN_API_URL: https://site.medschoolproffs.live
        run: bash scripts/build-hostinger.sh

      # ============================================================
      # VERIFY BUILD
      # ============================================================

      - name: Verify frontend builds
        run: |
          echo "Checking Student build..."

          test -s hostinger-out/student/index.html
          test -d hostinger-out/student/assets

          echo "Student build OK."

          echo "Checking Admin build..."

          test -s hostinger-out/admin/index.html
          test -d hostinger-out/admin/assets

          echo "Admin build OK."

          echo "Both frontend builds verified."

      # ============================================================
      # SAVE RECOVERY COPY
      # ============================================================

      - name: Save frontend builds
        uses: actions/upload-artifact@v4
        with:
          name: hostinger-frontends-${{ github.run_number }}
          path: |
            hostinger-out/student/
            hostinger-out/admin/
          include-hidden-files: true
          retention-days: 7

      # ============================================================
      # STUDENT DEPLOYMENT - ATTEMPT 1
      # ============================================================

      - name: Deploy Student - attempt 1
        id: student_1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 194.5.156.45
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./hostinger-out/student/
          server-dir: ./

      # ============================================================
      # STUDENT DEPLOYMENT - ATTEMPT 2
      # ============================================================

      - name: Wait before Student retry 2
        if: steps.student_1.outcome == 'failure'
        run: |
          echo "Student deployment attempt 1 failed."
          echo "Waiting 20 seconds before retry..."
          sleep 20

      - name: Deploy Student - attempt 2
        id: student_2
        if: steps.student_1.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 194.5.156.45
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./hostinger-out/student/
          server-dir: ./

      # ============================================================
      # STUDENT DEPLOYMENT - ATTEMPT 3
      # ============================================================

      - name: Wait before Student retry 3
        if: >
          steps.student_1.outcome == 'failure' &&
          steps.student_2.outcome == 'failure'
        run: |
          echo "Student deployment attempt 2 failed."
          echo "Waiting 40 seconds before final retry..."
          sleep 40

      - name: Deploy Student - attempt 3
        id: student_3
        if: >
          steps.student_1.outcome == 'failure' &&
          steps.student_2.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 194.5.156.45
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./hostinger-out/student/
          server-dir: ./

      # ============================================================
      # ADMIN DEPLOYMENT - ATTEMPT 1
      # ============================================================

      - name: Deploy Admin - attempt 1
        id: admin_1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 194.5.156.45
          username: ${{ secrets.ADMIN_FTP_USERNAME }}
          password: ${{ secrets.ADMIN_FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./hostinger-out/admin/
          server-dir: ./

      # ============================================================
      # ADMIN DEPLOYMENT - ATTEMPT 2
      # ============================================================

      - name: Wait before Admin retry 2
        if: steps.admin_1.outcome == 'failure'
        run: |
          echo "Admin deployment attempt 1 failed."
          echo "Waiting 20 seconds before retry..."
          sleep 20

      - name: Deploy Admin - attempt 2
        id: admin_2
        if: steps.admin_1.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 194.5.156.45
          username: ${{ secrets.ADMIN_FTP_USERNAME }}
          password: ${{ secrets.ADMIN_FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./hostinger-out/admin/
          server-dir: ./

      # ============================================================
      # ADMIN DEPLOYMENT - ATTEMPT 3
      # ============================================================

      - name: Wait before Admin retry 3
        if: >
          steps.admin_1.outcome == 'failure' &&
          steps.admin_2.outcome == 'failure'
        run: |
          echo "Admin deployment attempt 2 failed."
          echo "Waiting 40 seconds before final retry..."
          sleep 40

      - name: Deploy Admin - attempt 3
        id: admin_3
        if: >
          steps.admin_1.outcome == 'failure' &&
          steps.admin_2.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 194.5.156.45
          username: ${{ secrets.ADMIN_FTP_USERNAME }}
          password: ${{ secrets.ADMIN_FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./hostinger-out/admin/
          server-dir: ./

      # ============================================================
      # SUCCESS
      # ============================================================

      - name: Deployment completed
        if: success()
        run: |
          echo "=========================================="
          echo "HOSTINGER FRONTEND DEPLOYMENT SUCCESSFUL"
          echo "=========================================="
          echo "Student frontend deployed successfully."
          echo "Admin frontend deployed successfully."
          echo ""
          echo "API deployment is NOT handled here."
          echo "The cPanel API workflow remains separate."
          echo "=========================================="
