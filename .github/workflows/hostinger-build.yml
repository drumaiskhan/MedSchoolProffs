
name: Deploy Student + Admin + API to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Build Student + Admin + API
        env:
          API_URL: https://api.medschoolproffs.live
          VITE_API_BASE_URL: https://api.medschoolproffs.live
          VITE_STUDENT_URL: https://medschoolproffs.live
          VITE_ADMIN_API_URL: https://api.medschoolproffs.live
        run: bash scripts/build-hostinger.sh

      - name: Verify build output
        run: |
          echo "Student build:"
          ls -la hostinger-out/student/

          echo "Admin build:"
          ls -la hostinger-out/admin/

          echo "API build:"
          ls -la hostinger-out/api/
          ls -la hostinger-out/api/dist/

      - name: Deploy Student frontend
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 194.5.156.45
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./hostinger-out/student/
          server-dir: ./

      - name: Deploy Admin frontend
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 194.5.156.45
          username: ${{ secrets.ADMIN_FTP_USERNAME }}
          password: ${{ secrets.ADMIN_FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./hostinger-out/admin/
          server-dir: ./

      - name: Update API deployment branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/medschoolproffs-api-deploy
          mkdir -p /tmp/medschoolproffs-api-deploy
          cp -r hostinger-out/api/. /tmp/medschoolproffs-api-deploy/

          cd /tmp/medschoolproffs-api-deploy

          git init
          git checkout -b hostinger-api

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "Deploy API runtime from main"

          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          # GitHub occasionally answers a push with a transient "Internal Server
          # Error". Retry with backoff instead of failing the whole deploy (the
          # frontends have already been uploaded by this point, so a failed push
          # leaves the API one version behind them).
          for attempt in 1 2 3 4 5; do
            if git push origin hostinger-api --force; then
              exit 0
            fi
            echo "Push failed (attempt $attempt/5), retrying in $((attempt * 15))s..."
            sleep $((attempt * 15))
          done
          echo "::error::Could not push hostinger-api after 5 attempts"
          exit 1
