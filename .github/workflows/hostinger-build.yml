name: Test Hostinger FTP Connection

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Build Student + Admin
        env:
          API_URL: https://api.medschoolproffs.live
        run: |
          bash scripts/build-hostinger.sh

      - name: Verify build output
        run: |
          echo "Student build:"
          ls -la hostinger-out/student/

          echo "Admin build:"
          ls -la hostinger-out/admin/

      - name: Test Hostinger FTP connection
        run: |
          echo "Testing 194.5.156.45:21..."
          nc -vz -w 10 194.5.156.45 21
