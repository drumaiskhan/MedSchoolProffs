
name: Deploy API to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpanel-api-deployment
  cancel-in-progress: false

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      FTP_IP: "162.55.6.159"
      FTP_USER: "github-deploy@site.medschoolproffs.live"
      FTP_PORT: "21"
      HEALTH_URL: "https://site.medschoolproffs.live/api/healthz"

    steps:
      # 1. CHECKOUT
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. SETUP PNPM
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # 3. SETUP NODE
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # 4. BUILD API
      - name: Build API
        run: |
          set -euo pipefail
          pnpm install --no-frozen-lockfile
          pnpm run build:api

      # 5. EMBED DEPLOYMENT VERSION
      - name: Embed GitHub commit and deployment version
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from datetime import datetime, timezone

          bundle = Path(
              "artifacts/api-server/dist/index.mjs"
          )

          if not bundle.is_file():
              raise SystemExit("API bundle not found.")

          content = bundle.read_text(encoding="utf-8")

          commit = os.environ["GITHUB_SHA"]

          deployed_at = (
              datetime.now(timezone.utc)
              .isoformat(timespec="seconds")
              .replace("+00:00", "Z")
          )

          deployment_id = (
              os.environ["GITHUB_RUN_ID"]
              + "-"
              + os.environ["GITHUB_RUN_ATTEMPT"]
          )

          replacements = {
              "__DEPLOY_COMMIT__": commit,
              "__DEPLOYED_AT__": deployed_at,
              "__DEPLOY_RUN_ID__": deployment_id,
          }

          for placeholder, value in replacements.items():
              if placeholder not in content:
                  raise SystemExit(
                      f"Missing placeholder: {placeholder}"
                  )

              content = content.replace(
                  placeholder,
                  value
              )

          bundle.write_text(
              content,
              encoding="utf-8"
          )

          print("Deployment metadata embedded.")
          print(f"Commit: {commit}")
          print(f"Deployment ID: {deployment_id}")
          PY

      # 6. VERIFY API BUILD
      - name: Verify API build
        run: |
          set -euo pipefail

          test -s artifacts/api-server/dist/index.mjs

          ls -lh artifacts/api-server/dist/index.mjs

          if grep -q "__DEPLOY_COMMIT__" \
            artifacts/api-server/dist/index.mjs; then

            echo "::error::Deployment metadata missing."
            exit 1
          fi

          echo "API build verified."

      # 7. SAVE RECOVERY ARTIFACT
      - name: Save API build
        uses: actions/upload-artifact@v4
        with:
          name: cpanel-api-${{ github.run_number }}
          path: artifacts/api-server/dist/index.mjs
          retention-days: 7

      # 8. VALIDATE FTP SETTINGS
      - name: Validate FTP configuration
        env:
          FTP_HOST: ${{ secrets.CPANEL_FTP_HOST }}
          FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${FTP_HOST}" ]; then
            echo "::error::Set CPANEL_FTP_HOST to the verified FTPS hostname."
            exit 1
          fi

          if [ -z "${FTP_PASSWORD}" ]; then
            echo "::error::CPANEL_FTP_PASSWORD is missing."
            exit 1
          fi

          if [[ "${FTP_HOST}" == *"://"* || \
                "${FTP_HOST}" == *"/"* ]]; then
            echo "::error::FTP host must be a hostname only."
            exit 1
          fi

          echo "FTP configuration supplied."

      # 9. VERIFY FTP CONNECTION
      - name: Verify secure FTP login
        env:
          FTP_HOST: ${{ secrets.CPANEL_FTP_HOST }}
          FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
        run: |
          set -euo pipefail

          echo "Checking secure FTPS authentication..."

          curl \
            --fail \
            --show-error \
            --silent \
            --ssl-reqd \
            --ftp-pasv \
            --resolve "${FTP_HOST}:${FTP_PORT}:${FTP_IP}" \
            --connect-timeout 20 \
            --max-time 45 \
            --user "${FTP_USER}:${FTP_PASSWORD}" \
            "ftp://${FTP_HOST}/" \
            -o /dev/null

          echo "FTPS login successful."

      # 10. DEPLOY API
      - name: Deploy index.mjs to cPanel
        env:
          FTP_HOST: ${{ secrets.CPANEL_FTP_HOST }}
          FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
        run: |
          set -euo pipefail

          echo "Uploading API build..."

          curl \
            --fail \
            --show-error \
            --silent \
            --ssl-reqd \
            --ftp-pasv \
            --resolve "${FTP_HOST}:${FTP_PORT}:${FTP_IP}" \
            --connect-timeout 20 \
            --max-time 180 \
            --user "${FTP_USER}:${FTP_PASSWORD}" \
            --upload-file artifacts/api-server/dist/index.mjs \
            "ftp://${FTP_HOST}/index.mjs"

          echo "API uploaded successfully."

      # 11. RESTART CPANEL APPLICATION
      - name: Restart cPanel API
        env:
          FTP_HOST: ${{ secrets.CPANEL_FTP_HOST }}
          FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
        run: |
          set -euo pipefail

          echo "Deployment: ${GITHUB_SHA}" > restart.txt
          echo "Run: ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> restart.txt
          echo "Time: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> restart.txt

          echo "Requesting Passenger restart..."

          curl \
            --fail \
            --show-error \
            --silent \
            --ssl-reqd \
            --ftp-pasv \
            --resolve "${FTP_HOST}:${FTP_PORT}:${FTP_IP}" \
            --connect-timeout 20 \
            --max-time 60 \
            --user "${FTP_USER}:${FTP_PASSWORD}" \
            --upload-file restart.txt \
            "ftp://${FTP_HOST}/tmp/restart.txt"

          echo "Restart signal uploaded."

      # 12. WAIT FOR RESTART
      - name: Wait for API restart
        run: sleep 15

      # 13. VERIFY DEPLOYED API VERSION
      - name: Verify production API version
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_COMMIT="$GITHUB_SHA"
          EXPECTED_DEPLOYMENT="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          echo "Expected commit: $EXPECTED_COMMIT"
          echo "Expected deployment: $EXPECTED_DEPLOYMENT"

          for attempt in {1..12}; do

            echo "Verification attempt $attempt/12"

            if RESPONSE=$(curl \
              --fail \
              --show-error \
              --silent \
              --resolve "site.medschoolproffs.live:443:${FTP_IP}" \
              --connect-timeout 10 \
              --max-time 20 \
              -H "Cache-Control: no-cache" \
              "${HEALTH_URL}?deployment=${EXPECTED_DEPLOYMENT}"); then

              echo "$RESPONSE"

              if echo "$RESPONSE" | jq -e \
                --arg commit "$EXPECTED_COMMIT" \
                --arg deployment "$EXPECTED_DEPLOYMENT" \
                '
                  .status == "ok" and
                  .version == $commit and
                  .deploymentId == $deployment
                ' >/dev/null; then

                echo "API deployment verified."
                exit 0
              fi

              echo "Waiting for new deployment..."

            else
              echo "API not ready yet."
            fi

            if (( attempt < 12 )); then
              sleep 10
            fi

          done

          echo "::error::Production API version verification failed."
          exit 1

      # 14. DEPLOYMENT SUCCESS
      - name: Deployment completed
        run: |
          echo "======================================"
          echo "MedSchoolProffs API Deployment"
          echo "Status: VERIFIED"
          echo "Server: 162.55.6.159"
          echo "API: https://site.medschoolproffs.live"
          echo "Commit: $GITHUB_SHA"
          echo "Deployment: $GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "======================================"
