
name: Deploy API to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpanel-api-deployment
  cancel-in-progress: false

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      FTP_IP: "162.55.6.159"
      FTP_USER: "github-deploy@site.medschoolproffs.live"
      FTP_PORT: "21"
      HEALTH_URL: "https://site.medschoolproffs.live/api/healthz"

    steps:
      # 1. CHECKOUT
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. SETUP PNPM
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # 3. SETUP NODE
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # 4. BUILD API
      - name: Build API
        run: |
          set -euo pipefail
          pnpm install --no-frozen-lockfile
          pnpm run build:api

      # 5. EMBED DEPLOYMENT METADATA
      - name: Embed deployment metadata
        env:
          DEPLOY_COMMIT: ${{ github.sha }}
          DEPLOY_RUN_ID: ${{ github.run_id }}
          DEPLOY_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          from pathlib import Path
          from datetime import datetime, timezone

          bundle = Path("artifacts/api-server/dist/index.mjs")

          if not bundle.is_file():
              raise SystemExit("API bundle not found.")

          content = bundle.read_text(encoding="utf-8")

          replacements = {
              "__DEPLOY_COMMIT__": os.environ["DEPLOY_COMMIT"],
              "__DEPLOYED_AT__": datetime.now(timezone.utc)
                  .isoformat(timespec="seconds")
                  .replace("+00:00", "Z"),
              "__DEPLOY_RUN_ID__": (
                  os.environ["DEPLOY_RUN_ID"]
                  + "-"
                  + os.environ["DEPLOY_RUN_ATTEMPT"]
              ),
          }

          for placeholder, value in replacements.items():
              if placeholder not in content:
                  raise SystemExit(
                      f"Missing deployment placeholder: {placeholder}"
                  )

              content = content.replace(placeholder, value)

          bundle.write_text(content, encoding="utf-8")

          print("Deployment metadata embedded successfully.")
          print("Commit:", replacements["__DEPLOY_COMMIT__"])
          print("Deployment:", replacements["__DEPLOY_RUN_ID__"])
          PY

      # 6. VERIFY BUILD
      - name: Verify API build
        run: |
          set -euo pipefail

          BUNDLE="artifacts/api-server/dist/index.mjs"

          test -s "$BUNDLE"
          ls -lh "$BUNDLE"

          if grep -qE '__DEPLOY_COMMIT__|__DEPLOYED_AT__|__DEPLOY_RUN_ID__' "$BUNDLE"; then
            echo "::error::Unreplaced deployment metadata remains."
            exit 1
          fi

          echo "API bundle verified."

      # 7. SAVE RECOVERY ARTIFACT
      - name: Save API build
        uses: actions/upload-artifact@v4
        with:
          name: cpanel-api-${{ github.run_number }}
          path: artifacts/api-server/dist/index.mjs
          retention-days: 7

      # 8. VALIDATE FTP SETTINGS
      - name: Validate FTPS configuration
        env:
          FTP_HOST: ${{ secrets.CPANEL_FTP_HOST }}
          FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${FTP_HOST:-}" ]; then
            echo "::error::CPANEL_FTP_HOST secret is missing."
            exit 1
          fi

          if [ -z "${FTP_PASSWORD:-}" ]; then
            echo "::error::CPANEL_FTP_PASSWORD secret is missing."
            exit 1
          fi

          if [[ "$FTP_HOST" == *"://"* || "$FTP_HOST" == *"/"* || "$FTP_HOST" == *":"* ]]; then
            echo "::error::FTP_HOST must contain only the hostname."
            exit 1
          fi

          echo "FTPS configuration supplied."

      # 9. VERIFY FTPS LOGIN
      - name: Verify secure FTP login
        env:
          FTP_HOST: ${{ secrets.CPANEL_FTP_HOST }}
          FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
        run: |
          set -euo pipefail

          curl \
            --fail \
            --show-error \
            --silent \
            --ssl-reqd \
            --ftp-pasv \
            --resolve "${FTP_HOST}:${FTP_PORT}:${FTP_IP}" \
            --connect-timeout 20 \
            --max-time 45 \
            --user "${FTP_USER}:${FTP_PASSWORD}" \
            "ftp://${FTP_HOST}/" \
            -o /dev/null

          echo "FTPS login successful."

      # 10. DEPLOY THE BUNDLE TO THE ACTIVE STARTUP PATH
      - name: Deploy API bundle
        env:
          FTP_HOST: ${{ secrets.CPANEL_FTP_HOST }}
          FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
        run: |
          set -euo pipefail

          echo "Uploading compiled API to dist/index.mjs..."

          curl \
            --fail \
            --show-error \
            --silent \
            --ssl-reqd \
            --ftp-pasv \
            --resolve "${FTP_HOST}:${FTP_PORT}:${FTP_IP}" \
            --connect-timeout 20 \
            --max-time 180 \
            --user "${FTP_USER}:${FTP_PASSWORD}" \
            --upload-file artifacts/api-server/dist/index.mjs \
            "ftp://${FTP_HOST}/dist/index.mjs"

          echo "API bundle uploaded."

      # 11. RESTART PASSENGER
      - name: Restart cPanel API
        env:
          FTP_HOST: ${{ secrets.CPANEL_FTP_HOST }}
          FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
        run: |
          set -euo pipefail

          {
            echo "Deployment: ${GITHUB_SHA}"
            echo "Run: ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            echo "Time: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > restart.txt

          echo "Uploading Passenger restart signal..."

          curl \
            --fail \
            --show-error \
            --silent \
            --ssl-reqd \
            --ftp-pasv \
            --resolve "${FTP_HOST}:${FTP_PORT}:${FTP_IP}" \
            --connect-timeout 20 \
            --max-time 60 \
            --user "${FTP_USER}:${FTP_PASSWORD}" \
            --upload-file restart.txt \
            "ftp://${FTP_HOST}/tmp/restart.txt"

          echo "Passenger restart signal uploaded."

      # 12. WAIT FOR RESTART
      - name: Wait for API restart
        run: sleep 15

      # 13. VERIFY THE ACTUAL PRODUCTION VERSION
      - name: Verify deployed API version
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_COMMIT="${GITHUB_SHA}"
          EXPECTED_DEPLOYMENT="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          echo "Expected commit: ${EXPECTED_COMMIT}"
          echo "Expected deployment: ${EXPECTED_DEPLOYMENT}"

          for attempt in {1..12}; do
            echo "Verification attempt ${attempt}/12"

            if RESPONSE=$(curl \
              --fail \
              --show-error \
              --silent \
              --resolve "site.medschoolproffs.live:443:${FTP_IP}" \
              --connect-timeout 10 \
              --max-time 20 \
              -H "Cache-Control: no-cache" \
              "${HEALTH_URL}?deployment=${EXPECTED_DEPLOYMENT}"); then

              echo "${RESPONSE}"

              if echo "${RESPONSE}" | jq -e \
                --arg commit "${EXPECTED_COMMIT}" \
                --arg deployment "${EXPECTED_DEPLOYMENT}" \
                '
                  .status == "ok" and
                  .version == $commit and
                  .deploymentId == $deployment
                ' > /dev/null; then

                echo "Production API deployment verified."
                exit 0
              fi

              echo "The API is responding, but the expected version is not active."

            else
              echo "The API is not ready yet."
            fi

            if (( attempt < 12 )); then
              sleep 10
            fi
          done

          echo "::error::Production API version verification failed."
          exit 1

      # 14. DEPLOYMENT SUMMARY
      - name: Deployment completed
        run: |
          echo "======================================"
          echo "MedSchoolProffs API Deployment"
          echo "Status: VERIFIED"
          echo "Server: ${FTP_IP}"
          echo "API: https://site.medschoolproffs.live"
          echo "Commit: ${GITHUB_SHA}"
          echo "Deployment: ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "======================================"
