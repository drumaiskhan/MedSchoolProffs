
name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build student frontend
        env:
          VITE_API_BASE_URL: https://api.medschoolproffs.live
        run: pnpm --filter ./artifacts/frontend-student build

      - name: Sync Android
        working-directory: artifacts/frontend-student
        run: pnpm exec cap sync android

      - name: Build APK
        working-directory: artifacts/frontend-student/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MedSchoolProffs-Android
          path: artifacts/frontend-student/android/app/build/outputs/apk/debug/app-debug.apk
