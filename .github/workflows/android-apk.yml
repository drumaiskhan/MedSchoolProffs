
name: Build MedSchoolProffs Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # 3. Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      # 4. Install Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # 5. Install Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      # 6. Install project dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 7. Build the student frontend
      - name: Build student frontend
        env:
          VITE_API_BASE_URL: https://api.medschoolproffs.live
          VITE_STUDENT_URL: https://medschoolproffs.live
        run: pnpm --filter ./artifacts/frontend-student build

      # 8. Synchronize Capacitor
      - name: Sync Capacitor Android
        working-directory: artifacts/frontend-student
        run: pnpm exec cap sync android

      # 9. Build Android APK
      - name: Build debug APK
        working-directory: artifacts/frontend-student/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      # 10. Rename APK
      - name: Rename APK
        run: |
          cp \
            artifacts/frontend-student/android/app/build/outputs/apk/debug/app-debug.apk \
            MedSchoolProffs.apk

      # 11. Upload APK to GitHub Actions
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: MedSchoolProffs-Android
          path: MedSchoolProffs.apk
          retention-days: 30
          if-no-files-found: error
