    <style>
      /* Static branded loading screen */
      #root {
        background: #0e2a38;
      }

      .boot-loader {
        position: relative;
        display: flex;
        min-height: 100dvh;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: linear-gradient(
          160deg,
          #081420 0%,
          #0e2a38 42%,
          #12294a 72%,
          #1c2456 100%
        );
      }

      .boot-loader__orb {
        position: absolute;
        pointer-events: none;
        border-radius: 9999px;
        filter: blur(60px);
      }

      .boot-loader__orb--a {
        top: -25%;
        left: -25%;
        width: 60vmax;
        height: 60vmax;
        opacity: 0.6;
        background: radial-gradient(
          circle,
          rgba(45, 217, 196, 0.35),
          transparent 65%
        );
        animation: boot-orb-a 9s ease-in-out infinite;
      }

      .boot-loader__orb--b {
        bottom: -25%;
        right: -25%;
        width: 55vmax;
        height: 55vmax;
        opacity: 0.5;
        background: radial-gradient(
          circle,
          rgba(167, 139, 250, 0.35),
          transparent 65%
        );
        animation: boot-orb-b 11s ease-in-out infinite;
      }

      .boot-loader__orb--c {
        bottom: 0;
        left: 33%;
        width: 45vmax;
        height: 45vmax;
        opacity: 0.4;
        background: radial-gradient(
          circle,
          rgba(79, 216, 255, 0.3),
          transparent 65%
        );
        animation: boot-orb-c 13s ease-in-out infinite;
      }

      .boot-loader__card {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        padding: 48px 56px;
        border-radius: 28px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.07),
          rgba(255, 255, 255, 0.02)
        );
        box-shadow: 0 30px 80px -25px rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }

      .boot-loader__wave-wrap {
        animation: boot-tilt 4.5s ease-in-out infinite;
      }

      .boot-loader__wave {
        overflow: visible;
      }

      .boot-loader__wave path {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .boot-loader__wave-shadow {
        stroke: #03131c;
        stroke-opacity: 0.55;
        stroke-width: 4;
        transform: translate(2.5px, 3.5px);
      }

      .boot-loader__wave-glow {
        stroke: url(#boot-wave-grad);
        stroke-width: 7;
        filter: url(#boot-wave-blur);
        opacity: 0.8;
      }

      .boot-loader__wave-main {
        stroke: url(#boot-wave-grad);
        stroke-width: 4;
        stroke-dasharray: 190;
        stroke-dashoffset: 190;
        animation: boot-wave-draw 1.7s ease-in-out infinite;
      }

      .boot-loader__brand {
        font-family: 'Inter', system-ui, sans-serif;
        font-weight: 700;
        font-size: 24px;
        letter-spacing: -0.01em;
        background-image: linear-gradient(
          90deg,
          #eaf6f4,
          #4fd8ff,
          #a78bfa,
          #eaf6f4
        );
        background-size: 200% auto;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation:
          boot-shimmer 3.2s linear infinite,
          boot-fade 1.7s ease-in-out infinite;
      }

      .boot-loader__bar {
        position: relative;
        width: 144px;
        height: 4px;
        overflow: hidden;
        border-radius: 9999px;
        background: rgba(255, 255, 255, 0.1);
      }

      .boot-loader__bar-sweep {
        position: absolute;
        inset: 0 auto 0 0;
        width: 33%;
        border-radius: 9999px;
        background: linear-gradient(
          90deg,
          transparent,
          #4fd8ff,
          #a78bfa,
          transparent
        );
        animation: boot-bar-sweep 1.6s ease-in-out infinite;
      }

      @keyframes boot-wave-draw {
        0% {
          stroke-dashoffset: 190;
          opacity: 0.55;
        }
        55% {
          stroke-dashoffset: 0;
          opacity: 1;
        }
        100% {
          stroke-dashoffset: -190;
          opacity: 0.55;
        }
      }

      @keyframes boot-fade {
        0%, 100% {
          opacity: 0.6;
        }
        50% {
          opacity: 1;
        }
      }

      @keyframes boot-tilt {
        0%, 100% {
          transform: perspective(600px) rotateX(8deg) rotateY(-10deg) translateY(0);
        }
        50% {
          transform: perspective(600px) rotateX(-6deg) rotateY(10deg) translateY(-4px);
        }
      }

      @keyframes boot-orb-a {
        0%, 100% {
          transform: translate(-8%, -6%) scale(1);
        }
        50% {
          transform: translate(4%, 6%) scale(1.15);
        }
      }

      @keyframes boot-orb-b {
        0%, 100% {
          transform: translate(6%, 8%) scale(1);
        }
        50% {
          transform: translate(-6%, -4%) scale(1.2);
        }
      }

      @keyframes boot-orb-c {
        0%, 100% {
          transform: translate(0%, 0%) scale(1);
        }
        50% {
          transform: translate(-5%, 8%) scale(1.1);
        }
      }

      @keyframes boot-shimmer {
        0% {
          background-position: 0% 50%;
        }
        100% {
          background-position: 200% 50%;
        }
      }

      @keyframes boot-bar-sweep {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(210%);
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="boot-loader">
        <div class="boot-loader__orb boot-loader__orb--a"></div>
        <div class="boot-loader__orb boot-loader__orb--b"></div>
        <div class="boot-loader__orb boot-loader__orb--c"></div>

        <div class="boot-loader__card">
          <div class="boot-loader__wave-wrap">
            <svg

              width="88"
              height="55"
              viewBox="0 0 64 40"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"

              <defs>
                <linearGradient
                  id="boot-wave-grad"
                  x1="0"
                  y1="0"
                  x2="1"
                  y2="0.3"
                >
                  <stop offset="0%" stop-color="#2dd9c4" />
                  <stop offset="55%" stop-color="#4fd8ff" />
                  <stop offset="100%" stop-color="#a78bfa" />
                </linearGradient>

                <filter
                  id="boot-wave-blur"
                  x="-50%"
                  y="-50%"
                  width="200%"
                  height="200%"
                >
                  <feGaussianBlur stdDeviation="3.2" />
                </filter>
              </defs>

              <path
                class="boot-loader__wave-shadow"
                d="M2 20 H14 L19 6 L27 34 L33 12 L38 20 H62"
              />
              <path
                class="boot-loader__wave-glow"
                d="M2 20 H14 L19 6 L27 34 L33 12 L38 20 H62"
              />
              <path
                class="boot-loader__wave-main"
                d="M2 20 H14 L19 6 L27 34 L33 12 L38 20 H62"
              />
            </svg>
          </div>

          <div class="boot-loader__brand">MedSchoolProffs.live</div>

          <div class="boot-loader__bar">
            <div class="boot-loader__bar-sweep"></div>
          </div>
        </div>
      </div>
    </div>
